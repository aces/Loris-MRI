name: Tests

on:
  pull_request:
  push:
    branches:
    - 'main'
    - '*-release'
  schedule:
    - cron: '30 0 * * *'

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest

    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v4

    - name: Set up Python
      uses: ./.github/actions/setup-python
    - name: Run Typos
      run:  |
        set -o pipefail
        typos --format=json | test/typos_to_github.sh

  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v4

    - name: Set up Python
      uses: ./.github/actions/setup-python
    - name: Run Ruff
      run: ruff check --output-format=github

  pyright-strict:
    name: Pyright strict
    runs-on: ubuntu-latest

    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v4

    - name: Set up Python
      uses: ./.github/actions/setup-python

    - name: Run Pyright
      run: |
        set -o pipefail
        pyright --outputjson | test/pyright_to_github.sh

  pyrigh-global:
    name: Pyright global
    runs-on: ubuntu-latest

    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v4

    - name: Set up Python
      uses: ./.github/actions/setup-python

    - name: Run Pyright
      run: |
        set -o pipefail
        pyright --project test --outputjson | test/pyright_to_github.sh

  pytest:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v4

    - name: Set up Python
      uses: ./.github/actions/setup-python

    - name: Run Pytest
      run: pytest

  docker:
    name: Docker
    runs-on: ubuntu-latest
    env:
      DATABASE_NAME: TestDatabase
      DATABASE_USERNAME: TestUsername
      DATABASE_PASSWORD: TestPassword
    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Expose the GitHub cache service variables to Docker Compose, using the action is recommended
    # by the Docker documentation:
    # https://docs.docker.com/build/cache/backends/gha#authentication
    - name: Set up GitHub Actions cache access
      uses: crazy-max/ghaction-github-runtime@v4

    - name: Run integration tests
      env:
        LORIS_TEST_COMPOSE_OVERRIDE: ./test/docker-compose.ci.yml
      run: ./test/run_integration_tests.sh --loris-ref "${{ github.base_ref || github.ref_name }}"
