name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
    - 'main'
    - '*-release'
  schedule:
    - cron: '30 0 * * *'

jobs:
  typos:
    name: Typos
    # Run daily checks only in the upstream repository.
    if: &run_checks github.event_name != 'schedule' || github.repository == 'aces/loris-mri'
    runs-on: ubuntu-latest

    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v7

    - name: Set up Python
      uses: ./.github/actions/setup-python
    - name: Run Typos
      run:  |
        set -o pipefail
        typos --format=json | test/typos_to_github.sh

  ruff:
    name: Lints
    if: *run_checks
    runs-on: ubuntu-latest

    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v7

    - name: Set up Python
      uses: ./.github/actions/setup-python
    - name: Run Ruff
      run: ruff check --output-format=github

  pyright-strict:
    name: Type checks (strict)
    if: *run_checks
    runs-on: ubuntu-latest

    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v7

    - name: Set up Python
      uses: ./.github/actions/setup-python

    - name: Run Pyright
      run: |
        set -o pipefail
        pyright --outputjson | test/pyright_to_github.sh

  pyright-global:
    name: Type checks (global)
    if: *run_checks
    runs-on: ubuntu-latest

    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v7

    - name: Set up Python
      uses: ./.github/actions/setup-python

    - name: Run Pyright
      run: |
        set -o pipefail
        pyright --project test --outputjson | test/pyright_to_github.sh

  pytest-unit:
    name: Unit tests
    if: *run_checks
    runs-on: ubuntu-latest

    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v7

    - name: Set up Python
      uses: ./.github/actions/setup-python

    - name: Run Pytest
      run: pytest

  pytest-integration:
    name: Integration tests
    if: *run_checks
    runs-on: ubuntu-latest
    env:
      DATABASE_NAME: TestDatabase
      DATABASE_USERNAME: TestUsername
      DATABASE_PASSWORD: TestPassword
    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v7

    - name: Select LORIS core ref
      id: loris
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        DEFAULT_LORIS_REF: ${{ github.base_ref || github.ref_name }}
      run: |
        ref="$DEFAULT_LORIS_REF"
        line="${PR_BODY%%$'\n'*}"
        if [[ "$line" =~ ^LORIS\ PR:[[:blank:]]*https://github\.com/aces/[Ll]oris/pull/([1-9][0-9]*)/?[[:space:]]*$ ]]; then
          ref="refs/pull/${BASH_REMATCH[1]}/head"
        fi
        echo "Using LORIS core ref: $ref"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Expose the GitHub cache service variables to Docker Compose, using the action is recommended
    # by the Docker documentation:
    # https://docs.docker.com/build/cache/backends/gha#authentication
    - name: Set up GitHub Actions cache access
      uses: crazy-max/ghaction-github-runtime@v4

    - name: Run integration tests
      env:
        LORIS_TEST_COMPOSE_OVERRIDE: ./test/docker-compose.ci.yml
        LORIS_REF: ${{ steps.loris.outputs.ref }}
      run: ./test/run_integration_tests.sh
