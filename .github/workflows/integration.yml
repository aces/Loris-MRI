name: Integration tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
    - 'main'
    - '*-release'
  schedule:
    - cron: '30 0 * * *'

env:
  DATABASE_NAME: TestDatabase
  DATABASE_USERNAME: TestUsername
  DATABASE_PASSWORD: TestPassword

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
    - name: Check out LORIS-MRI
      uses: actions/checkout@v4

    - name: Select LORIS core ref
      id: loris
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        DEFAULT_LORIS_REF: ${{ github.base_ref || github.ref_name }}
      run: |
        ref="$DEFAULT_LORIS_REF"
        line="${PR_BODY%%$'\n'*}"
        if [[ "$line" =~ ^LORIS\ PR:[[:blank:]]*https://github\.com/aces/[Ll]oris/pull/([1-9][0-9]*)/?[[:space:]]*$ ]]; then
          ref="refs/pull/${BASH_REMATCH[1]}/head"
        fi
        echo "Using LORIS core ref: $ref"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Expose the GitHub cache service variables to Docker Compose, using the action is recommended
    # by the Docker documentation:
    # https://docs.docker.com/build/cache/backends/gha#authentication
    - name: Set up GitHub Actions cache access
      uses: crazy-max/ghaction-github-runtime@v4

    - name: Run integration tests
      env:
        LORIS_TEST_COMPOSE_OVERRIDE: ./test/docker-compose.ci.yml
        LORIS_REF: ${{ steps.loris.outputs.ref }}
      run: ./test/run_integration_tests.sh
